name: Feature request
description: Suggest an improvement or a new experiment.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs it and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives or references
      description: Related experiments, scientific sources or other approaches you considered.
